name: Code-coverage

on:
  push:
    branches:
      - master
  pull_request:
    branches: [ master, feat/*, rc/* ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [ self-hosted, Linux, X64 ]
    name: Build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
        id: go

      - name: Get dependencies
        run: go get -v -t -d ./...

      - name: Run unit tests
        run: |
          make test-coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: coverage.txt
          # OIDC for pushes and same-repo PRs. Fork PRs cannot obtain an id-token,
          # so OIDC is turned off for them and the action uses Codecov's tokenless upload path.
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
